<div class="d-flex flex-column flex-shrink-0 p-3 bg-white border-end vh-100">
  <!-- Logo -->
  <div class="mb-4 px-2">
    <h4 class="fw-bold text-primary mb-1">Pharmacy</h4>
    <small class="text-muted">Management System</small>
  </div>

  <!-- Navigation -->
  <nav class="nav nav-pills flex-column gap-2">
    <!-- Medicines -->
    <a
      routerLink="/medicines"
      routerLinkActive="active"
      class="nav-link text-dark"
    >
      Medicines
    </a>
    <!-- Dashboard -->
    <a
      routerLink="/dashboard"
      routerLinkActive="active"
      class="nav-link text-dark"
    >
      Dashboard
    </a>

    <!-- Categories -->
    <a
      routerLink="/categories"
      routerLinkActive="active"
      class="nav-link text-dark"
    >
      Categories
    </a>

    <!-- Customers -->
    <a
      routerLink="/customers"
      routerLinkActive="active"
      class="nav-link text-dark"
    >
      Customers
    </a>

    <!-- Suppliers -->
    <a
      routerLink="/suppliers"
      routerLinkActive="active"
      class="nav-link text-dark"
    >
      Suppliers
    </a>
  </nav>

  <!-- Logout -->
  <div class="mt-auto pt-3 border-top">
    <button
      type="button"
      class="btn btn-outline-danger w-100"
      (click)="logout()"
    >
      Logout
    </button>
  </div>
</div>

<!-- Logout Confirmation -->
@if (showLogoutConfirmation) {
  <div
    class="position-fixed top-0 start-0 w-100 h-100 d-flex justify-content-center align-items-center"
    style="background-color: rgba(0, 0, 0, 0.5); z-index: 1050"
  >
    <div class="card shadow" style="width: 400px">
      <div class="card-body p-4">
        <h5 class="card-title mb-3">Confirm Logout</h5>

        <p class="card-text text-muted">Are you sure you want to logout?</p>

        <div class="d-flex justify-content-end gap-2">
          <!-- Cancel -->
          <button
            type="button"
            class="btn btn-outline-secondary"
            (click)="cancelLogout()"
          >
            Cancel
          </button>

          <!-- Confirm Logout -->
          <button
            type="button"
            class="btn btn-danger"
            (click)="confirmLogout()"
          >
            Logout
          </button>
        </div>
      </div>
    </div>
  </div>
}
